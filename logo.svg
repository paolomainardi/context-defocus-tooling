<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <filter id="blur-heavy">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="blur-mid">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <filter id="blur-light">
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" fill="#0a0a0a"/>

  <!-- Outer ring - defocused (blurred, dim) -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="#d4ff3a" stroke-width="2" opacity="0.15" filter="url(#blur-heavy)"/>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#d4ff3a" stroke-width="1.5" opacity="0.2" filter="url(#blur-mid)"/>

  <!-- Middle ring - transitioning -->
  <circle cx="60" cy="60" r="32" fill="none" stroke="#d4ff3a" stroke-width="2" opacity="0.35" filter="url(#blur-light)"/>

  <!-- Inner ring - sharp, focused -->
  <circle cx="60" cy="60" r="20" fill="none" stroke="#d4ff3a" stroke-width="2.5" opacity="0.85"/>

  <!-- Core dot - perfectly focused, glowing -->
  <circle cx="60" cy="60" r="6" fill="#d4ff3a" opacity="1" filter="url(#glow)"/>

  <!-- Aperture blades (subtle) - suggesting a lens -->
  <g opacity="0.3" stroke="#d4ff3a" stroke-width="1" fill="none">
    <line x1="60" y1="16" x2="60" y2="26"/>
    <line x1="60" y1="94" x2="60" y2="104"/>
    <line x1="16" y1="60" x2="26" y2="60"/>
    <line x1="94" y1="60" x2="104" y2="60"/>
    <line x1="29" y1="29" x2="36" y2="36"/>
    <line x1="84" y1="84" x2="91" y2="91"/>
    <line x1="91" y1="29" x2="84" y2="36"/>
    <line x1="29" y1="91" x2="36" y2="84"/>
  </g>
</svg>
